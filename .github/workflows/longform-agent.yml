name: Longform Agent

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "analyses/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "fly.toml"
      - "tsconfig.json"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        required: true
        default: "run"
        type: choice
        options:
          - run         # wake existing machine with new YOUTUBE_URL (no rebuild)
          - deploy      # rebuild + push image to Fly registry
          - deploy-run  # rebuild then immediately run
      channel:
        description: "Channel name (must match a key in src/channels)"
        required: true
        default: "banditbiographies"
        type: string
      youtube_url:
        description: "Source YouTube URL (only used when mode=run or deploy-run)"
        required: false
        type: string

concurrency:
  group: longform-agent
  cancel-in-progress: false

env:
  FLY_APP: longform-tiktok-viral-creator-agent
  FLY_IMAGE: registry.fly.io/longform-tiktok-viral-creator-agent:latest

jobs:
  deploy:
    name: Build & push image, update machine
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'deploy' || inputs.mode == 'deploy-run'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Build & push image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # `--image-label latest` overrides the default `deployment-{ts}` tag so
        # the next step can reference :latest deterministically.
        run: flyctl deploy --build-only --push --remote-only --image-label latest --app "$FLY_APP"
      - name: Update existing machine to new image
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          ID=$(flyctl machines list --app "$FLY_APP" --json | jq -r '[.[] | select(.config.mounts != null)][0].id')
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::No volume-attached machine found on $FLY_APP. Run 'flyctl deploy' once locally to bootstrap."
            exit 1
          fi
          echo "Updating machine $ID → $FLY_IMAGE"
          flyctl machine update "$ID" --image "$FLY_IMAGE" --restart never --app "$FLY_APP" --yes

  run:
    name: Wake Fly machine for one render
    needs: [deploy]
    if: |
      always()
      && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped')
      && github.event_name == 'workflow_dispatch'
      && (inputs.mode == 'run' || inputs.mode == 'deploy-run')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.youtube_url }}" ]; then
            echo "::error::youtube_url input is required when mode=run or deploy-run."
            exit 1
          fi
      - name: Set per-run env on Fly machine and start it
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CHANNEL: ${{ inputs.channel }}
          YOUTUBE_URL: ${{ inputs.youtube_url }}
        run: |
          ID=$(flyctl machines list --app "$FLY_APP" --json | jq -r '[.[] | select(.config.mounts != null)][0].id')
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "::error::No volume-attached machine found on $FLY_APP."
            exit 1
          fi

          echo "Setting CHANNEL=$CHANNEL YOUTUBE_URL=$YOUTUBE_URL on machine $ID"
          flyctl machine update "$ID" \
            --env "CHANNEL=$CHANNEL" \
            --env "YOUTUBE_URL=$YOUTUBE_URL" \
            --restart never \
            --app "$FLY_APP" \
            --yes

          echo "Starting machine $ID"
          flyctl machine start "$ID" --app "$FLY_APP"

          # Poll until the machine exits (CMD finished). Cap at ~55 minutes.
          for i in $(seq 1 220); do
            STATE=$(flyctl machines list --app "$FLY_APP" --json \
              | jq -r --arg id "$ID" '.[] | select(.id == $id) | .state')
            echo "[$(date -u +%H:%M:%S)] machine state: ${STATE:-<unknown>}"
            if [ "$STATE" = "stopped" ]; then
              echo "Machine exited cleanly."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Machine still running after 55 min — check 'fly logs --app $FLY_APP'"
          exit 1
